<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Netology Shop</title>
</head>
<body style="padding: 50px; font-family: sans-serif;">
    <h1>Добро пожаловать в API Netology Shop</h1>

    {% if user.is_authenticated %}
        <!-- ЭТО УВИДИТ АВТОРИЗОВАННЫЙ ПОЛЬЗОВАТЕЛЬ -->
        <h2 style="color: green;"> Вы успешно вошли!</h2>

        <!-- Кнопка выхода (если есть URL для logout) -->
        <!-- <a href="/logout/">Выйти</a> -->

    {% else %}
        <!-- ЭТО УВИДИТ ГОСТЬ -->
        <p>Для авторизации нажмите кнопку ниже:</p>

        <form action="/social-auth/login/github/" method="post">
            {% csrf_token %}  <!-- ДИНАМИЧЕСКИЙ ТОКЕН DJANGO -->
            <button type="submit" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
                Войти через GitHub
            </button>
        </form>
    {% endif %}
</body>
</html>
